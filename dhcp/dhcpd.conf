# Este servidor es la autoridad DHCP de la red del laboratorio.
authoritative;

# Usa el mecanismo DDNS estándar con registros DHCID para detectar conflictos.
ddns-update-style standard;

# Autoriza al servidor DHCP a enviar actualizaciones DNS.
ddns-updates on;

# Evita que dos clientes reclamen silenciosamente el mismo nombre DNS.
update-conflict-detection on;

# No modifica mediante DDNS los hosts declarados con concesiones estáticas.
update-static-leases off;

# El servidor, no el cliente, controla el nombre que se publica en DNS.
ignore client-updates;

# Añade este dominio al hostname para construir el nombre completo directo.
ddns-domainname "aulasri.test.";

# Sufijo base usado para construir el nombre inverso de la dirección concedida.
ddns-rev-domainname "in-addr.arpa.";

# Prefiere el hostname solicitado; si falta, crea uno basado en la dirección.
ddns-hostname = pick-first-value(
    option host-name,
    concat("cliente-", binary-to-ascii(10, 8, "-", leased-address))
);

# Carga la misma clave que el primario utilizará para verificar la firma.
include "/run/tsig/named.conf.key";

# Envía las actualizaciones de la zona directa al DNS primario y firma con dhcp-ddns.
zone aulasri.test. {
    primary 10.53.0.100;
    key dhcp-ddns.;
}

# Envía las actualizaciones PTR de la zona inversa al mismo primario.
zone 0.53.10.in-addr.arpa. {
    primary 10.53.0.100;
    key dhcp-ddns.;
}

# Una concesión normal dura 60 segundos para poder observar renovaciones en clase.
default-lease-time 60;

# Ningún cliente puede conservar una concesión durante más de 180 segundos.
max-lease-time 180;

# El cliente intenta renovar con el mismo servidor a los 20 segundos (T1).
option dhcp-renewal-time 20;

# Si T1 falla, a los 40 segundos intenta renovar con cualquier servidor (T2).
option dhcp-rebinding-time 40;

# Comunica el dominio de búsqueda a los clientes.
option domain-name "aulasri.test";

# Comunica los dos servidores DNS autoritativos del laboratorio.
option domain-name-servers 10.53.0.100, 10.53.0.200;

# Define la red en la que este servidor puede conceder direcciones.
subnet 10.53.0.0 netmask 255.255.255.0 {
    # Informa al cliente de la máscara de la red.
    option subnet-mask 255.255.255.0;
    # Informa del gateway creado por Docker.
    option routers 10.53.0.1;
    # Informa de la dirección de broadcast.
    option broadcast-address 10.53.0.255;
    # Limita las concesiones al rango reservado para DHCP.
    range 10.53.0.120 10.53.0.170;
}