options {
    // Mantiene el directorio de trabajo estándar.
    directory "/var/cache/bind";
    // Atiende consultas IPv4 desde la red del laboratorio.
    listen-on { any; };
    // Mantiene la práctica centrada en IPv4.
    listen-on-v6 { none; };
    // Actúa como autoritativo, no como resolvedor recursivo.
    recursion no;
    // Permite que los clientes consulten la copia secundaria.
    allow-query { any; };
};

zone "aulasri.test" {
    // Indica que la zona se obtiene de otro servidor.
    type secondary;
    // Define el primario autorizado del que se copiará la zona.
    primaries { 10.53.0.100; };
    // Guarda la copia transferida en el volumen del secundario.
    file "/var/lib/bind/slave/aulasri.test";
    // Evita que este secundario redistribuya la zona a terceros.
    allow-transfer { none; };
};

zone "0.53.10.in-addr.arpa" {
    // La zona inversa también se recibe como secundaria.
    type secondary;
    // El mismo primario es el origen autorizado.
    primaries { 10.53.0.100; };
    // Persiste la copia inversa recibida.
    file "/var/lib/bind/slave/0.53.10.in-addr.arpa";
    // Bloquea transferencias posteriores desde este servidor.
    allow-transfer { none; };
};