options {
    // Usa el directorio de trabajo estándar de BIND.
    directory "/var/cache/bind";
    // Escucha en todas las interfaces IPv4 del contenedor.
    listen-on { any; };
    // Desactiva IPv6 en este laboratorio para concentrar la práctica en IPv4.
    listen-on-v6 { none; };
    // Impide usar este servidor autoritativo como resolvedor recursivo.
    recursion no;
    // Permite consultas desde cualquier contenedor de la red del laboratorio.
    allow-query { any; };
};

// Carga la clave creada en tiempo de ejecución; no se guarda en la imagen.
include "/run/tsig/named.conf.key";

logging {
    // Envía los eventos DDNS a los logs del contenedor.
    channel ddns_events { stderr; severity info; print-time yes; };
    // Registra actualizaciones aceptadas o fallidas.
    category update { ddns_events; };
    // Registra decisiones de autorización de update-policy.
    category update-security { ddns_events; };
    // Registra otros eventos de seguridad relevantes.
    category security { ddns_events; };
};

zone "aulasri.test" {
    // Declara que esta copia es la fuente editable de la zona.
    type primary;
    // Guarda la zona en el volumen persistente y escribible.
    file "/var/lib/bind/dynamic/db.aulasri.test";
    // Solo el secundario puede solicitar una transferencia.
    allow-transfer { 10.53.0.200; };
    // Avisa al secundario cuando cambia la zona.
    also-notify { 10.53.0.200; };
    // Activa el envío de notificaciones de cambio.
    notify yes;
    // La clave DHCP puede crear A y DHCID bajo aulasri.test, pero no modificar cualquier dato.
    update-policy { grant dhcp-ddns. wildcard *.aulasri.test. A DHCID; };
};

zone "0.53.10.in-addr.arpa" {
    // Esta también es una zona primaria editable.
    type primary;
    // La zona inversa se persiste separadamente.
    file "/var/lib/bind/dynamic/db.0.53.10";
    // Limita la transferencia al secundario.
    allow-transfer { 10.53.0.200; };
    // Notifica al secundario tras un cambio.
    also-notify { 10.53.0.200; };
    // Activa las notificaciones.
    notify yes;
    // La clave DHCP solo puede crear PTR dentro de esta zona inversa.
    update-policy { grant dhcp-ddns. zonesub PTR; };
};